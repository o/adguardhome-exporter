version: 2

project_name: adguardhome-exporter

before:
  hooks:
    - go mod tidy

builds:
  - id: adguardhome-exporter
    main: ./cmd/adguardhome-exporter
    binary: adguardhome-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.revision={{ .Commit }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
