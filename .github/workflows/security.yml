name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@988661ebb5e81487b3fb31b2185d2856c0a10679 # v4
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@e435ccd777264be153ace6237001ef4d979d3a7a # v4
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/autobuild@e435ccd777264be153ace6237001ef4d979d3a7a # v4
      - uses: github/codeql-action/analyze@e435ccd777264be153ace6237001ef4d979d3a7a # v4
