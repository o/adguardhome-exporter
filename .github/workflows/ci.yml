name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - if: matrix.os == 'ubuntu-latest'
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...

