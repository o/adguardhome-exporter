name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
      - run: go test ./...
      - if: matrix.os == 'ubuntu-latest'
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test -race ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate Compose and dashboard
        run: |
          docker compose config
          jq -e . dashboards/adguardhome-exporter.json >/dev/null
      - name: Build image
        run: docker build -t adguardhome-exporter:ci .
      - name: Verify image health check
        run: |
          docker run -d --name exporter \
            -e ADGUARD_TARGET_1_NAME=ci \
            -e ADGUARD_TARGET_1_URL=http://192.0.2.1 \
            adguardhome-exporter:ci
          trap 'docker logs exporter; docker rm -f exporter' EXIT
          for attempt in {1..15}; do
            if docker exec exporter /adguardhome-exporter healthcheck; then
              exit 0
            fi
            sleep 1
          done
          exit 1

